apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: step-ca-acme
  annotations:
    company-pki.example/optional: "true"
spec:
  acme:
    server: https://step-ca.step-ca.svc.cluster.local/acme/acme/directory
    privateKeySecretRef:
      name: step-ca-acme-account-key
    solvers:
      - http01:
          ingress:
            class: REPLACE_ME
# Optional — core step-ca deploy does not depend on cert-manager.
