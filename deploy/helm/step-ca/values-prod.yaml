replicaCount: 3

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

kms:
  keyId: "REPLACE_ME_INTERMEDIATE_KMS_KEY_ID"
  region: "REPLACE_ME_REGION"
  endpointUrl: ""

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::AWS_ACCOUNT_ID:role/REPLACE_ME-step-ca"

# IRSA only — do not inject ACCESS_KEY Secret on EKS
aws:
  credentialsSecretName: ""

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

networkPolicy:
  allowAllIngress: false
  egressCIDRs: []  # TODO: set VPC / KMS endpoint CIDRs

podDisruptionBudget:
  enabled: true
  minAvailable: 2

serviceMonitor:
  enabled: true

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: step-ca
        topologyKey: kubernetes.io/hostname
