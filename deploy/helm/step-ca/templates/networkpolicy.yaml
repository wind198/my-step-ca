{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "step-ca.fullname" . }}
  labels:
    {{- include "step-ca.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "step-ca.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.networkPolicy.allowAllIngress }}
    - {}
    {{- else }}
    - from:
        {{- if .Values.networkPolicy.allowedNamespaceLabels }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.allowedNamespaceLabels | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 9000
    {{- end }}
  egress:
    {{- if .Values.networkPolicy.egressDNS }}
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- range .Values.networkPolicy.egressCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ . }}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 4566
    {{- end }}
{{- end }}
